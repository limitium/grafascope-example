# grafascope-dev: environment overrides (merged over grafascope/values.yaml)

global:
  domain: localhost
  hosts: []
  image:
    registry: ""
  imagePullSecrets:
    - name: 
  storageClassName: ""
  clusterName: grafascope-dev
  # Gateway API configuration for HTTPRoute resources.
  # gateway:
  #   enabled: true
  #   routes:
  #     parentRefs:
  #       - name: gateway-svc
  #         namespace: tr-gateway
  #         sectionName: https
  #     hostnames:
  #       - "*.staging.example.com"

grafana:
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      memory: 1Gi

victoria-metrics:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

victoria-logs:
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

victoria-traces:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

vmagent:
  remoteWriteUrl: "http://victoria-metrics:8428/grafascope/victoria-metrics/api/v1/write"
  scrapeTargets:
    - job_name: dev-apps
      metrics_path: /metrics
      static_configs:
        - targets:
            - demo-apps-grafascope-demo-apps-service-a:8000
            - demo-apps-grafascope-demo-apps-service-b:8000
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      memory: 256Mi

fluent-bit:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 512Mi
  config:
    outputs: |
      [OUTPUT]
          Name http
          Match kube.*
          Host victoria-logs.grafascope.svc.cluster.local
          Port 9428
          URI /grafascope/victoria-logs/insert/jsonline?_stream_fields=stream,kubernetes_pod_name,kubernetes_namespace,kubernetes_container_name,service,cluster&_msg_field=_msg,log&_time_field=date
          Format json_lines
          Header Content-Type application/json
          Json_date_format iso8601
