# grafascope-dev: environment overrides (merged over grafascope/values.yaml)

global:
  domain: localhost
  hosts: []
  image:
    registry: ""
  imagePullSecrets: []
  storageClassName: ""
  clusterName: grafascope-dev
  # Gateway API configuration for HTTPRoute resources.
  # gateway:
  #   enabled: true
  #   routes:
  #     parentRefs:
  #       - name: gateway-svc
  #         namespace: tr-gateway
  #         sectionName: https
  #     hostnames:
  #       - "*.staging.example.com"

grafana:
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: "500m"
      memory: 512Mi
    limits:
      memory: 1Gi

victoria-metrics:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

victoria-logs:
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

victoria-traces:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: 256Mi
    limits:
      memory: 512Mi

vmagent:
  remoteWriteUrl: "http://victoria-metrics:8428/grafascope/victoria-metrics/api/v1/write"
  scrapeJmxScraper: true
  scrapeTargets:
    - job_name: dev-apps
      metrics_path: /metrics
      static_configs:
        - targets:
            - demo-apps-grafascope-demo-apps-service-a:8000
            - demo-apps-grafascope-demo-apps-service-b:8000
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      memory: 256Mi

# Concrete JMX example used by scripts/k3d-test-jmx-scraper.sh. The scraper stays
# ready when this test endpoint is absent; the smoke script creates it before deployment.
jmx-scraper:
  enabled: true
  config:
    scraperYaml: |
      global:
        scrapeInterval: 30s
        scrapeTimeout: 10s
        maxConcurrentScrapes: 4

      jmx:
        lowercaseOutputName: true
        lowercaseOutputLabelNames: true
        inferCounterTypeFromName: true
        autoExcludeObjectNameAttributes: true

      endpoints:
        test-jmx-java:
          hostPort: test-jmx-java:9999
          ssl: false

      collectors:
        basic-jvm:
          includeObjectNames:
            - "java.lang:type=Memory"
            - "java.lang:type=Threading"
            - "java.lang:type=Runtime"
          rules:
            - pattern: 'java.lang<type=Memory><HeapMemoryUsage>(used|committed|max|init): (.*)'
              name: jvm_memory_$1_bytes
              help: Bytes for JVM heap memory by state.
              type: GAUGE
              labels:
                area: heap
            - pattern: 'java.lang<type=Threading><>ThreadCount: (.*)'
              name: jvm_threads_current
              help: Current live JVM threads.
              type: GAUGE
            - pattern: 'java.lang<type=Runtime><>Uptime: (.*)'
              name: jvm_uptime_seconds
              help: JVM uptime in seconds.
              type: GAUGE
              valueFactor: 0.001

      jobs:
        - name: dev-jvms
          endpoints: [test-jmx-java]
          collectors: [basic-jvm]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

fluent-bit:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 512Mi
  config:
    outputs: |
      [OUTPUT]
          Name http
          Match kube.*
          Host victoria-logs.grafascope.svc.cluster.local
          Port 9428
          URI /grafascope/victoria-logs/insert/jsonline?_stream_fields=stream,kubernetes_pod_name,kubernetes_namespace,kubernetes_container_name,service,cluster&_msg_field=_msg,log&_time_field=date
          Format json_lines
          Header Content-Type application/json
          Json_date_format iso8601
