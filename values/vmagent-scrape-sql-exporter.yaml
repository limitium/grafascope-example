# Merge when upgrading grafascope-vmagent. Turns on the optional sql-exporter scrape job
# (same idea as includeDefaultScrapeJobs: a single boolean on the vmagent subchart).
#
# Expects a Service named sql-exporter in the same namespace (from grafascope-sql-exporter release
# or a direct install of scrapers/sql-exporter). Port comes from global.ports.sql-exporter (default 9399).
#
# From submodule root (grafascope-example/grafascope), after sql-exporter is deployed:
#   ./scripts/update-and-upgrade.sh grafascope-obs vmagent
#   # or merge this file into any vmagent upgrade:
#   helm upgrade --install grafascope-vmagent ./grafascope/releases/vmagent -n grafascope \
#     -f grafascope/values.yaml \
#     -f ../values/grafascope-obs.yaml \
#     -f ../values/vmagent-scrape-sql-exporter.yaml
#
# For cross-namespace scrape, keep scrapeSqlExporter false and use vmagent.scrapeTargets with an FQDN instead.

vmagent:
  scrapeSqlExporter: true
