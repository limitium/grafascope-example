# Values for the jmx-exporter chart alone (not the vmagent umbrella).
# Deploy jmx-exporter in its own release; vmagent scrapes it via Service DNS
# (see vmagent-scrape-jmx-exporter.yaml).
#
# From submodule root (grafascope-example/grafascope):
#   helm upgrade --install jmx-exporter ./grafascope/scrapers/jmx-exporter -n grafascope \
#     -f ../values/jmx-exporter-standalone.yaml
#
# For vmagent scrape integration:
#   helm upgrade --install grafascope-vmagent ./grafascope/releases/vmagent -n grafascope \
#     -f grafascope/values.yaml \
#     -f ../values/grafascope-obs.yaml \
#     -f ../values/vmagent-scrape-jmx-exporter.yaml

enabled: true

global:
  ports:
    jmx-exporter: 9404
  image:
    registry: ""

config:
  # Backward-compatible single-target mode lives here.
  # For multiple endpoints/metrics use `targets` below.
  jmxExporterYaml: ""

targets:
  - name: service-a
    service:
      enabled: true
      type: ClusterIP
      port: 9404
    config:
      jmxExporterYaml: |
        startDelaySeconds: 0
        lowercaseOutputName: true
        lowercaseOutputLabelNames: true
        jmxUrl: service:jmx:rmi:///jndi/rmi://java-service-a:9999/jmxrmi
        ssl: false
        rules:
          - pattern: "java.lang<type=Memory><HeapMemoryUsage>used: (\\d+)"
            name: service_a_jvm_memory_heap_used_bytes
            type: GAUGE

  - name: service-b
    service:
      enabled: true
      type: ClusterIP
      port: 9404
    config:
      jmxExporterYaml: |
        startDelaySeconds: 0
        lowercaseOutputName: true
        lowercaseOutputLabelNames: true
        jmxUrl: service:jmx:rmi:///jndi/rmi://java-service-b:9999/jmxrmi
        ssl: false
        rules:
          - pattern: "java.lang<type=Threading><ThreadCount>: (\\d+)"
            name: service_b_jvm_threads_current
            type: GAUGE
        help: "Current heap memory used in bytes."

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
