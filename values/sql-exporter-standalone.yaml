# Values for the sql-exporter chart alone (not the vmagent umbrella).
# Deploy sql_exporter in its own release; vmagent scrapes it via a Kubernetes Service DNS name
# (see vmagent-scrape-sql-exporter.yaml).
#
# Passwords: Kubernetes Secret keys hold the raw password strings only (no full DSN). sql_exporter
# expands ${LEDGER_PASSWORD} / ${WAREHOUSE_PASSWORD} from the Pod environment into the DSN below.
# Non-secret connection details (host, user, database name, sslmode) stay in this file as plain text.
#
# From submodule root (grafascope-example/grafascope):
#   kubectl -n grafascope create secret generic sql-exporter-db-passwords \
#     --from-literal=ledger-password='REPLACE_ME' \
#     --from-literal=warehouse-password='REPLACE_ME'
#
#   helm upgrade --install sql-exporter ./grafascope/scrapers/sql-exporter -n grafascope \
#     -f ../values/sql-exporter-standalone.yaml
#
# Service name is the chart default `sql-exporter` (see scrapers/sql-exporter templates). Scrape URL examples:
#   same namespace: sql-exporter:9399
#   full DNS:       sql-exporter.grafascope.svc.cluster.local:9399
#
# -----------------------------------------------------------------------------
# Collectors vs targets (burningalchemist/sql_exporter)
# -----------------------------------------------------------------------------
#
# Within ONE job:
#   - static_configs[].targets is a map of name -> DSN (each DSN is one "target").
#   - collectors: [a, b, ...] means collectors a AND b BOTH run against EVERY target in that job.
#   There is no finer mapping like "collector a only on target X" inside a single job.
#
# Across jobs:
#   - Each job has its own collectors list and its own targets. Job A's collectors never run on
#     job B's DSNs unless you list the same collector_name on both jobs (and the SQL works on both).
#
# Many databases, same queries: one job, many keys under targets, one collectors list.
# Many databases, different queries: separate jobs, each with its own collectors list.
#
# Trim jobs/collectors and DSN hosts below to match what you actually run (replace test-pg-postgresql
# and database name when not using the k3d smoke script's Bitnami Postgres).

enabled: true

# Vendored sql-exporter chart reads global.image.registry; define global.image so Helm does not
# dereference a missing key when only ports are overridden (submodule chart; do not patch it here).
global:
  ports:
    sql-exporter: 9399
  image:
    registry: ""

config:
  useOracleBootstrap: false
  sqlExporterYml: |
    global:
      scrape_timeout: 30s
      scrape_timeout_offset: 500ms
      max_connections: 3
      max_idle_connections: 3

    jobs:
      - job_name: ledger_postgres
        collectors: [ledger_db_counters]
        enable_ping: false
        static_configs:
          - targets:
              primary: "postgresql://postgres:${LEDGER_PASSWORD}@test-pg-postgresql:5432/postgres?sslmode=disable"

      - job_name: warehouse_postgres
        collectors: [warehouse_table_counters]
        enable_ping: false
        static_configs:
          - targets:
              primary: "postgresql://postgres:${WAREHOUSE_PASSWORD}@test-pg-postgresql:5432/postgres?sslmode=disable"

    collector_files:
      - "*.collector.yml"

  collectorFiles:
    ledger_db_counters.collector.yml: |
      collector_name: ledger_db_counters
      metrics:
        - metric_name: ledger_db_transactions_committed_total
          type: counter
          help: "Committed transactions (pg_stat_database) on ledger connection."
          key_labels:
            - datname
          values: [xact_commit]
          query: |
            SELECT datname, xact_commit::float8 AS xact_commit
            FROM pg_stat_database
            WHERE datname IS NOT NULL

    warehouse_table_counters.collector.yml: |
      collector_name: warehouse_table_counters
      metrics:
        - metric_name: warehouse_table_seq_scans_total
          type: counter
          help: "Sequential scans (pg_stat_user_tables) on warehouse connection — different query/DB."
          key_labels:
            - schemaname
            - relname
          values: [seq_scan]
          query: |
            SELECT schemaname, relname, seq_scan::float8 AS seq_scan
            FROM pg_stat_user_tables

extraEnv:
  - name: LEDGER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: sql-exporter-db-passwords
        key: ledger-password
  - name: WAREHOUSE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: sql-exporter-db-passwords
        key: warehouse-password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
