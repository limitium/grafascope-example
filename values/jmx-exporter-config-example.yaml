# =============================================================================
# JMX exporter config example (jmx_prometheus_javaagent)
# =============================================================================
#
# Use this file as a source for your Java app's JMX exporter config (config.yaml).
# It is not consumed directly by grafascope charts; mount/copy the `jmxExporterConfigYml`
# content into your Java workload and expose the exporter port (example: 9404).
#
# Java startup example:
#   -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/config.yaml
#
# Pair with vmagent scrape overlay:
#   values/vmagent-scrape-jmx-exporter.yaml
#
# Notes:
# - Keep `lowercaseOutputName` and `lowercaseOutputLabelNames` to normalize names.
# - The `rules` section maps MBeans/attributes to Prometheus metrics.
# - Example below exports heap used bytes from:
#     java.lang:type=Memory
#   attribute:
#     HeapMemoryUsage.used
# =============================================================================

jmxExporterConfigYml: |
  startDelaySeconds: 0
  lowercaseOutputName: true
  lowercaseOutputLabelNames: true
  whitelistObjectNames:
    - "java.lang:type=Memory"
    - "java.lang:type=GarbageCollector,name=*"
    - "java.lang:type=Threading"

  rules:
    # Explicit mapping: java.lang Memory HeapMemoryUsage.used -> gauge metric.
    - pattern: 'java.lang<type=Memory><HeapMemoryUsage>used: (\d+)'
      name: jvm_memory_heap_used_bytes
      type: GAUGE
      help: "Current heap memory used in bytes."

    # Optional additional examples:
    - pattern: 'java.lang<type=Threading><ThreadCount>: (\d+)'
      name: jvm_threads_current
      type: GAUGE
      help: "Current live thread count."

    - pattern: 'java.lang<type=GarbageCollector,name=(.+)><CollectionCount>: (\d+)'
      name: jvm_gc_collection_count_total
      type: COUNTER
      labels:
        gc: "$1"
      help: "Total number of completed GC collections by collector."
